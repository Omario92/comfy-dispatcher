<!-- =====================================================
     BTN-VIDEO-LOADING — Beer Loading Button (v4.0)
     Thay thế hoàn toàn #btn-get-video bằng hai ảnh WebP:
       - BEER_BAR.webp làm khung ngoài (shell background)
       - BEER_BAR_2.webp làm ruột bia (fill mask)
     Loại bỏ hoàn toàn các border thừa, track và bubbles CSS.
===================================================== -->

<style>
  /* ============================
     GOOGLE FONT IMPORT
  ============================ */
  @import url('https://fonts.googleapis.com/css2?family=Nunito:wght@500;600&display=swap');

  /* ============================
     VARIABLES
  ============================ */
  :root {
    --beer-btn-width: min(680px, 96vw);
    --beer-btn-height: 72px;
  }
  @media (max-width: 480px) {
    :root {
      --beer-btn-height: 48px;
    }
  }

  /* ============================
     RESET & WRAPPER
  ============================ */
  #btn-video-loading {
    display: flex;
    align-items: center;
    justify-content: center;
    width: 100%;
    padding: 0;
    margin: 0 auto;
  }

  /* ============================
     OUTER SHELL (BEER_BAR.webp as frame background)
  ============================ */
  .beer-btn-shell {
    position: relative;
    display: flex;
    align-items: center;
    justify-content: center;
    width: var(--beer-btn-width);
    height: var(--beer-btn-height);
    border-radius: 999px;
    background: url("https://biatuoi-halida.com/wp-content/uploads/sites/2/2026/05/BEER_BAR.webp") no-repeat center;
    background-size: 100% 100%;
    overflow: visible;

    /* Subtle drop shadow down-right when not ready */
    box-shadow: 4px 6px 15px rgba(0, 0, 0, 0.16);

    /* Normal state (when loading/disabled) */
    cursor: wait !important;
    transition: transform 0.3s ease, filter 0.3s ease, opacity 0.3s ease !important;
  }

  /* HOVER - CHỈ HOẠT ĐỘNG KHI ĐÃ SẴN SÀNG (is-ready) */
  .beer-btn-shell.is-ready {
    cursor: pointer !important;
    animation: beerReadyPulse 1.6s ease-in-out infinite;
  }

  .beer-btn-shell.is-ready:hover {
    transform: scale(1.03) !important;
    filter: brightness(1.05) !important;
  }

  /* READY glow pulse */
  @keyframes beerReadyPulse {
    0%, 100% {
      box-shadow: 4px 6px 15px rgba(0, 0, 0, 0.16), 0 0 0 2px rgba(198, 137, 34, 0.3), 0 6px 20px rgba(198, 137, 34, 0.4);
    }
    50% {
      box-shadow: 4px 6px 15px rgba(0, 0, 0, 0.12), 0 0 0 4px rgba(244, 216, 119, 0.5), 0 8px 28px rgba(244, 216, 119, 0.6);
    }
  }

  /* ERROR state */
  .beer-btn-shell.is-error {
    filter: grayscale(60%) brightness(0.85) !important;
    cursor: not-allowed !important;
    animation: none !important;
  }
  .beer-btn-shell.is-error:hover {
    transform: none !important;
    filter: grayscale(60%) brightness(0.85) !important;
  }

  /* HIDDEN state */
  .beer-btn-shell.is-hidden {
    opacity: 0;
    pointer-events: none;
    transform: scale(0.95);
    display: none !important;
  }

  /* ============================
     BEER IMAGE (with clip-path progress)
  ============================ */
  .beer-btn-beer {
    position: absolute;
    inset: 0;
    background: url("https://biatuoi-halida.com/wp-content/uploads/sites/2/2026/05/BEER_BAR_2.webp") no-repeat center;
    background-size: 100% 100%;
    pointer-events: none;
    clip-path: inset(0 calc(100% - var(--beer-progress, 8%)) 0 0);
    transition: clip-path 0.6s ease-in-out;
    will-change: clip-path;
  }

  /* ============================
     LABEL TEXT
  ============================ */
  .beer-btn-label {
    position: absolute;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    pointer-events: none;
    z-index: 10;
  }

  .beer-btn-label span {
    font-family: "Myriad Pro", "Myriat-Pro", "Myriad Web Pro", "Nunito", "Gill Sans", "Optima", "Segoe UI", sans-serif;
    font-size: clamp(15px, 2.5vw, 22px);
    font-weight: 600;
    letter-spacing: 0.6px;
    color: #1f1d53;
    text-align: center;
    /* Căn giữa dọc chính xác khi có sprite inline */
    display: inline-flex;
    align-items: center;
    gap: 4px;
    line-height: 1;

    text-shadow:
      0 1px 0 rgba(255,255,255,0.65),
      0 2px 6px rgba(0, 0, 0, 0.22),
      0 -1px 2px rgba(254, 226, 129, 0.5);

    -webkit-text-stroke: 0.3px rgba(255,255,255,0.3);
    user-select: none;
    transition: color 0.3s ease;
  }

  /* ============================
     SPRITE RUN ANIMATION — 24fps
     Sprite sheet: 8 cols × 7 rows, mỗi frame gốc 128×128px
     Hiển thị tại 52×52px: scale = 52/128 = 0.40625
       → background-size: 416px (1024×0.40625) × 364px (896×0.40625)
       → mỗi bước sprite-col = 52px, sprite-row = 52px
  ============================ */

  /* Wrapper: không overflow:hidden để không clip sprite */
  .beer-btn-sprite-wrap {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
    /* Không cần position/overflow — sprite tự vừa kích thước */
  }

  .beer-btn-sprite {
    /* Hiển thị trực tiếp 52×52px, không dùng transform */
    display: block;
    width: 52px;
    height: 52px;
    flex-shrink: 0;
    background-image: url('https://biatuoi-halida.com/wp-content/uploads/sites/2/2026/05/Run_Sprite_sheets.webp');
    background-repeat: no-repeat;
    background-position: 0 0;
    /* Scale background xuống: 1024 × 0.40625 = 416px, 896 × 0.40625 = 364px */
    background-size: 416px 364px;
    /* 24fps: mỗi hàng = 8 frames × (1/24s) ≈ 0.333s */
    animation:
      sprite-col-sm 0.333s steps(8, end) infinite,
      sprite-row-sm 2.333s steps(1, end) infinite;
  }

  /* Mobile ≤ 480px: hiển thị 40×40px, scale = 40/128 = 0.3125
     background-size: 320px (1024×0.3125) × 280px (896×0.3125) */
  @media (max-width: 480px) {
    .beer-btn-sprite {
      width: 40px;
      height: 40px;
      background-size: 320px 280px;
      animation:
        sprite-col-xs 0.333s steps(8, end) infinite,
        sprite-row-xs 2.333s steps(1, end) infinite;
    }
  }

  /* Desktop: bước = 52px × 8 = 416px */
  @keyframes sprite-col-sm {
    from { background-position-x: 0px; }
    to   { background-position-x: -416px; }
  }
  @keyframes sprite-row-sm {
    0%     { background-position-y: 0px; }
    14.28% { background-position-y: -52px; }
    28.57% { background-position-y: -104px; }
    42.85% { background-position-y: -156px; }
    57.14% { background-position-y: -208px; }
    71.42% { background-position-y: -260px; }
    85.71% { background-position-y: -312px; }
    100%   { background-position-y: -312px; }
  }

  /* Mobile: bước = 40px × 8 = 320px */
  @keyframes sprite-col-xs {
    from { background-position-x: 0px; }
    to   { background-position-x: -320px; }
  }
  @keyframes sprite-row-xs {
    0%     { background-position-y: 0px; }
    14.28% { background-position-y: -40px; }
    28.57% { background-position-y: -80px; }
    42.85% { background-position-y: -120px; }
    57.14% { background-position-y: -160px; }
    71.42% { background-position-y: -200px; }
    85.71% { background-position-y: -240px; }
    100%   { background-position-y: -240px; }
  }

  /* Ẩn sprite khi ready hoặc error */
  .beer-btn-shell.is-ready  .beer-btn-sprite-wrap,
  .beer-btn-shell.is-error  .beer-btn-sprite-wrap { display: none; }

  /* ============================
     CHECKMARK icon (visible when ready)
  ============================ */
  .beer-btn-check {
    display: none;
    margin-left: 8px;
    font-size: 1.1em;
    font-style: normal;
  }
  .beer-btn-shell.is-ready .beer-btn-check { display: inline; }
</style>

<!-- ===== MARKUP ===== -->
<div id="btn-video-loading">
  <div class="beer-btn-shell" id="_beer-shell">
    
    <!-- Beer image (with clip-path progress) -->
    <div class="beer-btn-beer" id="_beer-beer"></div>

    <!-- Label -->
    <div class="beer-btn-label">
      <span id="_beer-text">Video Đang Được Tạo
        <span class="beer-btn-sprite-wrap">
          <div class="beer-btn-sprite"></div>
        </span>
        <i class="beer-btn-check">✓</i>
      </span>
    </div>

  </div>
</div>
