<!-- =====================================================
     BTN-VIDEO-LOADING — Beer Loading Button (v2)
     Thay thế hoàn toàn #btn-get-video trong frontend_script.html
     CSS ID wrapper: btn-video-loading

     TRẠNG THÁI:
       loading  → Beer fill tăng dần 90s, text "Video Đang Được Tạo..."
       ready    → Fill 100%, text "Video Đã Sẵn Sàng", glow pulse
       hidden   → Ẩn sau khi user click (video đã hiện)
       error    → Text "Video Không Khả Dụng", fill dừng

     PUBLIC API (gọi từ frontend_script.html):
       window.beerBtnReset()       — Reset về trạng thái loading
       window.beerBtnComplete()    — Fill 100%, chuyển sang "Video Đã Sẵn Sàng"
       window.beerBtnError()       — Hiện trạng thái lỗi
       window.beerBtnHide()        — Ẩn button (sau khi click)
       window.beerBtnShow()        — Hiện lại button
===================================================== -->

<style>
  /* ============================
     GOOGLE FONT IMPORT (Fallback nếu Myriad Pro chưa load)
  ============================ */
  @import url('https://fonts.googleapis.com/css2?family=Nunito:wght@500;600&display=swap');

  /* ============================
     RESET & WRAPPER
  ============================ */
  #btn-video-loading {
    display: flex;
    align-items: center;
    justify-content: center;
    width: 100%;
    padding: 0;
    margin: 0 auto;
  }

  /* ============================
     OUTER SHELL (Gold border pill)
  ============================ */
  .beer-btn-shell {
    position: relative;
    display: flex;
    align-items: center;
    justify-content: center;
    width: min(680px, 96vw);
    height: 72px;
    border-radius: 999px;
    padding: 5px;

    /* Brand palette #f4d877 / #c68922 */
    background:
      linear-gradient(180deg,
        #f4d877 0%,
        #e0b840 18%,
        #c68922 40%,
        #e0b840 60%,
        #f4d877 80%,
        #c68922 100%
      );

    box-shadow:
      0 0 0 2px #b07610,
      0 6px 28px rgba(198, 137, 34, 0.65),
      0 2px 8px rgba(244, 216, 119, 0.4) inset,
      0 -2px 8px rgba(120, 70, 0, 0.3) inset;

    /* Normal state */
    cursor: pointer;
    transition: transform 0.3s ease, filter 0.3s ease, opacity 0.3s ease;
  }

  /* Hover */
  .beer-btn-shell:hover {
    transform: scale(1.05) !important;
    filter: brightness(1.1) !important;
  }

  /* READY state — glow pulse */
  .beer-btn-shell.is-ready {
    animation: beerReadyPulse 1.6s ease-in-out infinite;
  }

  @keyframes beerReadyPulse {
    0%, 100% { box-shadow: 0 0 0 2px #b07610, 0 6px 28px rgba(198,137,34,0.65), 0 2px 8px rgba(244,216,119,0.4) inset; }
    50%       { box-shadow: 0 0 0 4px #f4d877, 0 8px 36px rgba(244,216,119,0.9), 0 2px 12px rgba(244,216,119,0.6) inset; }
  }

  /* ERROR state */
  .beer-btn-shell.is-error {
    filter: grayscale(60%) brightness(0.85);
    cursor: not-allowed;
    animation: none;
  }
  .beer-btn-shell.is-error:hover {
    transform: none !important;
    filter: grayscale(60%) brightness(0.85) !important;
  }

  /* HIDDEN state */
  .beer-btn-shell.is-hidden {
    opacity: 0;
    pointer-events: none;
    transform: scale(0.95);
  }

  /* ============================
     INNER TRACK (hollow pill)
  ============================ */
  .beer-btn-track {
    position: relative;
    width: 100%;
    height: 100%;
    border-radius: 999px;
    overflow: hidden;
    background: linear-gradient(180deg, #d4940e 0%, #a86810 40%, #c68922 70%, #d8a830 100%);

    box-shadow:
      inset 0 3px 10px rgba(0, 0, 0, 0.35),
      inset 0 -2px 6px rgba(244, 216, 119, 0.3);
  }

  /* ============================
     BEER FILL (animated left portion)
  ============================ */
  .beer-btn-fill {
    position: absolute;
    left: 0;
    top: 0;
    height: 100%;
    width: 8%;
    border-radius: 999px 0 0 999px;
    overflow: hidden;
    will-change: width;
    transition: width 0.6s ease-in-out;

    background:
      radial-gradient(ellipse at 30% 60%, rgba(255,255,255,0.20) 0%, transparent 55%),
      linear-gradient(180deg,
        #e8a828 0%,
        #c68922 25%,
        #b07210 55%,
        #c88820 80%,
        #e8a828 100%
      );
  }

  /* Shiny highlight on beer fill */
  .beer-btn-fill::after {
    content: "";
    position: absolute;
    inset: 0;
    background: linear-gradient(180deg,
      rgba(255,255,255,0.28) 0%,
      rgba(255,255,255,0.06) 45%,
      transparent 60%
    );
  }

  /* DIVIDER LINE between fill and empty */
  .beer-btn-fill::before {
    content: "";
    position: absolute;
    right: 0;
    top: 8%;
    height: 84%;
    width: 3px;
    background: linear-gradient(180deg,
      transparent 0%,
      rgba(255,255,255,0.5) 20%,
      rgba(255,255,255,0.7) 50%,
      rgba(255,255,255,0.5) 80%,
      transparent 100%
    );
    border-radius: 2px;
    box-shadow: 0 0 8px rgba(255,255,255,0.4);
  }

  /* ============================
     ANIMATED BUBBLES inside fill
  ============================ */
  .beer-bubbles {
    position: absolute;
    inset: 0;
    overflow: hidden;
    border-radius: 999px 0 0 999px;
  }

  .bubble {
    position: absolute;
    border-radius: 50%;
    background: radial-gradient(circle at 35% 35%, rgba(255,255,255,0.8), rgba(255,200,80,0.3));
    opacity: 0;
    animation: bubble-rise var(--dur, 2.4s) ease-in infinite;
    animation-delay: var(--delay, 0s);
  }

  @keyframes bubble-rise {
    0%   { transform: translateY(0) scale(1);   opacity: 0; }
    10%  { opacity: 0.75; }
    80%  { opacity: 0.5; }
    100% { transform: translateY(-60px) scale(0.6); opacity: 0; }
  }

  /* ============================
     FOAM on top of fill
  ============================ */
  .beer-foam {
    position: absolute;
    top: 4px;
    left: 6px;
    right: 6px;
    height: 10px;
    border-radius: 999px;
    background: linear-gradient(90deg,
      rgba(255,255,255,0.55) 0%,
      rgba(255,240,200,0.35) 40%,
      rgba(255,255,255,0.1) 70%,
      transparent 100%
    );
    overflow: hidden;
    pointer-events: none;
  }

  .beer-foam::after {
    content: "";
    position: absolute;
    inset: 0;
    background:
      radial-gradient(circle at 15% 50%, rgba(255,255,255,0.6) 4px, transparent 4px),
      radial-gradient(circle at 30% 40%, rgba(255,255,255,0.5) 3px, transparent 3px),
      radial-gradient(circle at 48% 60%, rgba(255,255,255,0.5) 5px, transparent 5px),
      radial-gradient(circle at 65% 45%, rgba(255,255,255,0.4) 3px, transparent 3px),
      radial-gradient(circle at 80% 55%, rgba(255,255,255,0.5) 4px, transparent 4px);
  }

  /* ============================
     LABEL TEXT
  ============================ */
  .beer-btn-label {
    position: absolute;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    pointer-events: none;
    z-index: 10;
  }

  .beer-btn-label span {
    font-family: "Myriad Pro", "Myriat-Pro", "Myriad Web Pro", "Nunito", "Gill Sans", "Optima", "Segoe UI", sans-serif;
    font-size: clamp(15px, 2.5vw, 22px);
    font-weight: 500;
    letter-spacing: 0.6px;
    color: #1f1d53;
    text-align: center;

    text-shadow:
      0 1px 0 rgba(255,255,255,0.55),
      0 2px 6px rgba(0, 0, 0, 0.18),
      0 -1px 2px rgba(244, 216, 119, 0.4);

    -webkit-text-stroke: 0.3px rgba(255,255,255,0.3);
    user-select: none;
    transition: color 0.3s ease;
  }

  /* ============================
     TYPING DOTS ANIMATION
  ============================ */
  .beer-btn-dots {
    display: inline-flex;
    margin-left: 3px;
    gap: 3px;
    align-items: flex-end;
    height: 1em;
  }

  .beer-btn-dots i {
    display: inline-block;
    width: 5px;
    height: 5px;
    border-radius: 50%;
    background: #1f1d53;
    opacity: 0;
    animation: dot-blink 1.4s ease-in-out infinite;
  }
  .beer-btn-dots i:nth-child(1) { animation-delay: 0s; }
  .beer-btn-dots i:nth-child(2) { animation-delay: 0.2s; }
  .beer-btn-dots i:nth-child(3) { animation-delay: 0.4s; }

  @keyframes dot-blink {
    0%, 80%, 100% { opacity: 0; transform: scale(0.7); }
    40%            { opacity: 1; transform: scale(1); }
  }

  /* Hide dots when ready/error */
  .beer-btn-shell.is-ready  .beer-btn-dots,
  .beer-btn-shell.is-error  .beer-btn-dots { display: none; }

  /* ============================
     CHECKMARK icon (visible when ready)
  ============================ */
  .beer-btn-check {
    display: none;
    margin-left: 8px;
    font-size: 1.1em;
    font-style: normal;
  }
  .beer-btn-shell.is-ready .beer-btn-check { display: inline; }

  /* ============================
     SHINE SWEEP on entire button
  ============================ */
  .beer-btn-track::after {
    content: "";
    position: absolute;
    inset: 0;
    background: linear-gradient(
      110deg,
      transparent 20%,
      rgba(255,255,255,0.12) 40%,
      rgba(255,255,255,0.22) 50%,
      rgba(255,255,255,0.12) 60%,
      transparent 80%
    );
    background-size: 200% 100%;
    border-radius: 999px;
    animation: shine-sweep 3.5s linear infinite;
    pointer-events: none;
    z-index: 5;
  }

  @keyframes shine-sweep {
    0%   { background-position: -100% center; }
    100% { background-position: 200% center; }
  }

  /* ============================
     TOP GLOSS on outer shell
  ============================ */
  .beer-btn-shell::before {
    content: "";
    position: absolute;
    top: 5px;
    left: 10%;
    right: 10%;
    height: 40%;
    border-radius: 999px;
    background: linear-gradient(180deg,
      rgba(244, 216, 119, 0.45) 0%,
      rgba(255,255,255,0.06) 100%
    );
    pointer-events: none;
    z-index: 20;
  }

  /* ============================
     RESPONSIVE
  ============================ */
  @media (max-width: 480px) {
    .beer-btn-shell { height: 58px; }
  }
</style>

<!-- ===== MARKUP ===== -->
<div id="btn-video-loading">
  <div class="beer-btn-shell" id="_beer-shell">
    <div class="beer-btn-track">

      <!-- Beer fill with animated bubbles -->
      <div class="beer-btn-fill" id="_beer-fill">
        <div class="beer-bubbles" id="_beer-bubbles"></div>
      </div>

      <!-- Foam highlight -->
      <div class="beer-foam"></div>

      <!-- Label -->
      <div class="beer-btn-label">
        <span id="_beer-text">Video Đang Được Tạo
          <span class="beer-btn-dots">
            <i></i><i></i><i></i>
          </span>
          <i class="beer-btn-check">✓</i>
        </span>
      </div>

    </div><!-- /.beer-btn-track -->
  </div><!-- /.beer-btn-shell -->
</div><!-- /#btn-video-loading -->

<script>
(function () {
  /* ============================================================
     BTN-VIDEO-LOADING — Full Integration Script
     Thay thế hoàn toàn #btn-get-video trong frontend_script.html
  ============================================================ */

  // Find local elements relative to this script instance's parent container
  // to avoid multi-instance conflicts (e.g. Elementor duplicating Desktop/Mobile widgets)
  var currentScript = document.currentScript;
  var container     = currentScript ? currentScript.parentNode : document;

  var shell   = container.querySelector(".beer-btn-shell");
  var fill    = container.querySelector(".beer-btn-fill");
  var bubWrap = container.querySelector(".beer-bubbles");
  var textEl  = container.querySelector(".beer-btn-label > span");

  if (!shell || !fill) {
    console.warn("[beerBtn] Missing critical DOM element shell or fill. Returning.");
    return;
  }

  /* ---- Bubble factory ---- */
  if (bubWrap) {
    var BUBBLE_COUNT = 14;
    for (var b = 0; b < BUBBLE_COUNT; b++) {
      var bEl = document.createElement("div");
      bEl.className = "bubble";
      var size = (3 + Math.random() * 8) + "px";
      bEl.style.cssText = [
        "width:"   + size,
        "height:"  + size,
        "left:"    + (5 + Math.random() * 88) + "%",
        "bottom:"  + (Math.random() * 30) + "px",
        "--dur:"   + (1.6 + Math.random() * 2.4) + "s",
        "--delay:" + (Math.random() * 3) + "s",
      ].join(";");
      bubWrap.appendChild(bEl);
    }
  }

  /* ---- State ---- */
  var _pct        = 8;
  var _timer      = null;
  var _isReady    = false;
  var _isError    = false;
  var FAKE_DUR_MS = 90000; // 90s fake loading duration

  /* ---- Internal helpers ---- */
  function _setFill(pct) {
    _pct = Math.max(0, Math.min(100, pct));
    if (fill) {
      fill.style.width = _pct + "%";
      // Khi fill gần đầy → ẩn divider line vì trông lạ ở 100%
      fill.style.borderRadius = _pct >= 98 ? "999px" : "999px 0 0 999px";
    }
  }

  function _clearTimer() {
    if (_timer) { clearInterval(_timer); _timer = null; }
  }

  function _setLabel(txt) {
    if (!textEl) return;
    try {
      // Giữ nguyên dots & check spans, chỉ thay text node đầu
      // Tìm hoặc tạo text node đầu tiên để cập nhật an toàn
      var firstChild = textEl.childNodes[0];
      if (firstChild && firstChild.nodeType === 3) { // Node.TEXT_NODE === 3
        firstChild.nodeValue = txt + " ";
      } else {
        var newText = document.createTextNode(txt + " ");
        textEl.insertBefore(newText, textEl.firstChild);
      }
    } catch (e) {
      console.warn("[beerBtn] Failed to set label:", e);
    }
  }

  /* ---- Start loading progress (fake 90s) ---- */
  function _startProgress() {
    _clearTimer();
    _isReady = false;
    _isError = false;
    if (shell) {
      shell.classList.remove("is-ready", "is-error", "is-hidden");
    }
    _setFill(8);
    _setLabel("Video Đang Được Tạo");

    var start = Date.now();

    _timer = setInterval(function () {
      var elapsed = Date.now() - start;
      var t   = Math.min(elapsed / FAKE_DUR_MS, 1);
      // Ease-out: nhanh đầu, chậm cuối, tối đa 90%
      var val = 8 + (82 * (1 - Math.pow(1 - t, 2.5)));
      _setFill(val);
      if (t >= 1) _clearTimer();
    }, 300);
  }

  /* ============================================================
     LOCAL INSTANCE METHODS — Safe for multiple instances
  ============================================================ */
  function localReset() {
    _isReady = false;
    _isError = false;
    _startProgress();
  }

  function localComplete() {
    _clearTimer();
    _isReady = true;
    _isError = false;
    if (shell) {
      shell.classList.add("is-ready");
      shell.classList.remove("is-error");
    }
    _setLabel("Video Đã Sẵn Sàng");
    // Animate fill lên 100% mượt
    if (fill) {
      fill.style.transition = "width 1.2s cubic-bezier(0.16,1,0.3,1)";
      _setFill(100);
      setTimeout(function () {
        if (fill) fill.style.transition = "width 0.6s ease-in-out";
      }, 1300);
    }
  }

  function localError() {
    _clearTimer();
    _isError = true;
    _isReady = false;
    if (shell) {
      shell.classList.add("is-error");
      shell.classList.remove("is-ready");
    }
    _setLabel("Video Không Khả Dụng");
  }

  function localHide() {
    if (shell) shell.classList.add("is-hidden");
  }

  function localShow() {
    if (shell) shell.classList.remove("is-hidden");
  }

  /* Expose to global window for backward compatibility (holds the latest instance) */
  window.beerBtnReset    = localReset;
  window.beerBtnComplete = localComplete;
  window.beerBtnError    = localError;
  window.beerBtnHide     = localHide;
  window.beerBtnShow     = localShow;

  /* ============================================================
     CLICK HANDLER — Sao chép logic btn-get-video
  ============================================================ */
  shell.addEventListener("click", function () {
    // Chỉ phản ứng khi đã sẵn sàng
    if (!_isReady || _isError) return;

    var faceswapState = window.faceswapState;
    if (!faceswapState || (!faceswapState.videoUrl && !faceswapState.currentVideoUrl)) return;
    var targetVideoUrl = faceswapState.videoUrl || faceswapState.currentVideoUrl;

    /* 1. Ẩn ảnh preview */
    var resultImageEl = document.getElementById("result-image");
    if (resultImageEl) resultImageEl.classList.remove("visible");

    /* 2. Chuyển btn-download sang video mode */
    faceswapState.downloadMode = "video";
    var btnDownload = document.getElementById("btn-download");
    if (btnDownload) btnDownload.textContent = "TẢI VIDEO";

    /* 3. Hiện #result-video + autoplay */
    var resultVideoEl = document.getElementById("result-video");
    if (resultVideoEl) {
      resultVideoEl.classList.remove("video-section-hidden");
      var vid = resultVideoEl.querySelector("video.elementor-video")
             || resultVideoEl.querySelector("video");
      if (vid) {
        vid.classList.remove("video-hidden");
        vid.classList.add("video-visible");
        if (vid.src !== targetVideoUrl) {
          vid.src = targetVideoUrl;
          vid.load();
        }
        vid.play().catch(function () {});
      }
    }

    /* 4. Ẩn button này sau khi click */
    localHide();

    /* 5. Ẩn video-status-hint nếu có */
    var hint = document.getElementById("video-status-hint");
    if (hint) hint.style.display = "none";

    /* 6. Scroll mượt đến video */
    if (resultVideoEl) {
      resultVideoEl.scrollIntoView({ behavior: "smooth", block: "start" });
    }
  });

  /* ============================================================
     BRIDGE — Đồng bộ với frontend_script.html qua DOM events
     frontend_script.html phát events để TẤT CẢ các beerBtn biết
     khi nào cần chuyển trạng thái (giải quyết triệt để lỗi duplicate widget Desktop/Mobile)
  ============================================================ */
  document.addEventListener("beerBtn:reset",    localReset);
  document.addEventListener("beerBtn:complete", localComplete);
  document.addEventListener("beerBtn:error",    localError);
  document.addEventListener("beerBtn:hide",     localHide);
  document.addEventListener("beerBtn:show",     localShow);

  /* ============================================================
     AUTO-SYNC với DOM (interval bridge nếu không dùng events)
     Quan sát window.faceswapState để tự cập nhật trạng thái
  ============================================================ */
  var _syncInterval = setInterval(function () {
    var st = window.faceswapState;
    if (!st) return;

    // Nếu videoUrl hoặc currentVideoUrl vừa được set (backend trả về video) → chuyển sang ready
    if ((st.videoUrl || st.currentVideoUrl) && !_isReady && !_isError) {
      localComplete();
    }
  }, 500);

  /* ---- Auto-start on page load ---- */
  _startProgress();

})();
</script>
