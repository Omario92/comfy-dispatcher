<!-- =====================================================
     RUN_ANIMATION — 3 Bouncing Arrows & Anton Text Title (v5.0)
     
     Thay thế hoàn toàn Sprite Sheet cũ bằng:
       - 3 Dấu mũi tên nhấp nháy chỉ xuống xếp ngang hàng.
       - Dòng chữ in hoa, font Anton to: "VIDEO AI ĐANG ĐƯỢC TẠO..."
     
     Tự động đồng bộ các trạng thái và đổi chữ thông qua 
     patch nhẹ vào window.beerBtn*
===================================================== -->

<style>
  /* ============================
     GOOGLE FONT & ICON IMPORT
  ============================ */
  @import url('https://fonts.googleapis.com/css2?family=Anton&family=Nunito:wght@700;900&display=swap');

  /* ============================
     VARIABLES
  ============================ */
  :root {
    --arrow-size-widget: 84px; /* Tăng kích thước từ 56px lên 84px để to rõ hơn */
  }
  @media (max-width: 480px) {
    :root {
      --arrow-size-widget: 60px; /* Tăng kích thước từ 40px lên 60px ở Mobile */
    }
  }

  /* ============================
     MAIN WIDGET CONTAINER
  ============================ */
  .arrows-text-widget-container {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    width: 100%;
    margin: 15px auto 10px;
    font-family: 'Nunito', sans-serif;
    transition: opacity 0.4s ease, transform 0.4s ease;
  }

  .arrows-text-widget-container.widget-hidden {
    opacity: 0;
    pointer-events: none;
    transform: translateY(10px);
    display: none !important;
  }

  .arrows-text-widget-container.widget-error {
    opacity: 0.55;
    filter: grayscale(60%);
  }

  /* ============================
     3 HORIZONTAL ARROWS
  ============================ */
  .arrows-row-widget {
    display: flex;
    justify-content: center;
    align-items: center;
    gap: 25px;
    margin-bottom: 5px;
    transition: opacity 0.4s ease, transform 0.4s ease;
  }
  
  @media (max-width: 480px) {
    .arrows-row-widget {
      gap: 15px;
    }
  }

  .arrow-item-widget {
    width: var(--arrow-size-widget);
    height: var(--arrow-size-widget);
    display: flex;
    align-items: center;
    justify-content: center;
    transition: transform 0.4s ease;
  }

  .arrow-item-widget svg {
    width: 100%;
    height: 100%;
    filter: drop-shadow(0 3px 8px rgba(255, 179, 0, 0.45));
  }

  /* Bounce loop nhịp nhàng khi loading */
  @keyframes arrowWidgetLoadingBounce {
    0%, 100% { transform: translateY(0px); }
    50%      { transform: translateY(8px); }
  }
  
  .arrows-text-widget-container.widget-loading-state .arrow-item-widget {
    animation: arrowWidgetLoadingBounce 0.9s ease-in-out infinite;
  }
  .arrows-text-widget-container.widget-loading-state .arrow-item-widget:nth-child(1) { animation-delay: 0s; }
  .arrows-text-widget-container.widget-loading-state .arrow-item-widget:nth-child(2) { animation-delay: 0.2s; }
  .arrows-text-widget-container.widget-loading-state .arrow-item-widget:nth-child(3) { animation-delay: 0.4s; }

  /* Bounce mạnh mẽ khi ready thu hút click */
  @keyframes arrowWidgetReadyBounce {
    0%, 100% { transform: translateY(0px) scale(1); }
    50%      { transform: translateY(15px) scale(1.15); }
  }
  .arrows-text-widget-container.widget-ready-state .arrow-item-widget {
    animation: arrowWidgetReadyBounce 0.8s cubic-bezier(0.175, 0.885, 0.32, 1.275) infinite;
  }
  .arrows-text-widget-container.widget-ready-state .arrow-item-widget:nth-child(1) { animation-delay: 0s; }
  .arrows-text-widget-container.widget-ready-state .arrow-item-widget:nth-child(2) { animation-delay: 0.15s; }
  .arrows-text-widget-container.widget-ready-state .arrow-item-widget:nth-child(3) { animation-delay: 0.3s; }

  /* ============================
     ANTON LARGE UPPERCASE TEXT
  ============================ */
  .anton-title-widget {
    font-family: 'Anton', sans-serif;
    font-size: clamp(26px, 4.8vw, 42px);
    text-transform: uppercase;
    color: #1f1d53; /* Đổi màu chữ sang xanh đậm thương hiệu Halida */
    text-align: center;
    margin: 10px 0 20px 0;
    letter-spacing: 2px;
    line-height: 1.15;
    
    /* Thiết lập shadow sáng màu (white stroke) để nổi bật chữ tối màu trên nền vàng */
    text-shadow:
      0 1px 0 rgba(255, 255, 255, 0.95),
      0 2px 4px rgba(255, 255, 255, 0.65),
      0 3px 8px rgba(0, 0, 0, 0.15),
      0 -1px 2px rgba(254, 226, 129, 0.75);
      
    -webkit-text-stroke: 0.45px rgba(255, 255, 255, 0.75);
    user-select: none;
    transition: color 0.3s ease;
  }

  /* Nhấp nháy nhẹ kích thích sự tò mò khi loading */
  @keyframes textWidgetLoadingGlow {
    0%, 100% { 
      opacity: 1; 
      text-shadow: 
        0 1px 0 rgba(255, 255, 255, 0.95),
        0 2px 4px rgba(255, 255, 255, 0.65),
        0 3px 8px rgba(0, 0, 0, 0.15),
        0 0 10px rgba(255, 179, 0, 0.3); 
    }
    50%      { 
      opacity: 0.88; 
      text-shadow: 
        0 1px 0 rgba(255, 255, 255, 0.95),
        0 2px 4px rgba(255, 255, 255, 0.75),
        0 3px 8px rgba(0, 0, 0, 0.1),
        0 0 18px rgba(255, 179, 0, 0.55); 
    }
  }
  .arrows-text-widget-container.widget-loading-state .anton-title-widget {
    animation: textWidgetLoadingGlow 1.8s ease-in-out infinite;
  }

  /* Đổi màu và pulse mạnh khi ready */
  @keyframes textWidgetReadyGlow {
    0%, 100% { 
      transform: scale(1); 
      color: #1f1d53; 
      text-shadow: 
        0 1px 0 rgba(255, 255, 255, 0.95),
        0 2px 4px rgba(255, 255, 255, 0.75),
        0 0 15px rgba(255, 179, 0, 0.4); 
    }
    50%      { 
      transform: scale(1.02); 
      color: #151341; 
      text-shadow: 
        0 1px 0 rgba(255, 255, 255, 0.95),
        0 2px 6px rgba(255, 255, 255, 0.85),
        0 0 25px rgba(255, 179, 0, 0.75); 
    }
  }
  .arrows-text-widget-container.widget-ready-state .anton-title-widget {
    animation: textWidgetReadyGlow 1.4s ease-in-out infinite;
  }

  /* 3 chấm nhấp nháy */
  .typing-dots-widget {
    display: inline-flex;
    gap: 3px;
    margin-left: 2px;
  }
  .typing-dots-widget span {
    display: inline-block;
    animation: dot-widget-blink 1.4s infinite;
    opacity: 0;
  }
  .typing-dots-widget span:nth-child(1) { animation-delay: 0s; }
  .typing-dots-widget span:nth-child(2) { animation-delay: 0.2s; }
  .typing-dots-widget span:nth-child(3) { animation-delay: 0.4s; }

  @keyframes dot-widget-blink {
    0%, 80%, 100% { opacity: 0; }
    40%            { opacity: 1; }
  }
</style>

<!-- ============================
     DYNAMIC STATE PATROLLER
================================ -->
<script>
(function () {
  var _state = 'loading'; // 'loading' | 'ready' | 'error' | 'hidden'
  var container = document.getElementById('arrowsTextWidget');
  var textEl    = document.getElementById('widgetAntonText');

  function updateWidgetState(state) {
    if (_state === state) return;
    console.log("[arrows-widget] state change:", _state, "->", state);
    _state = state;

    container.className = 'arrows-text-widget-container';

    switch (state) {
      case 'loading':
        container.classList.add('widget-loading-state');
        textEl.innerHTML = 'VIDEO AI ĐANG ĐƯỢC TẠO<span class="typing-dots-widget" id="widgetTextDots"><span>.</span><span>.</span><span>.</span></span>';
        container.style.display = '';
        container.style.opacity = '1';
        break;

      case 'ready':
        container.classList.add('widget-ready-state');
        textEl.innerHTML = 'VIDEO ĐÃ SẴN SÀNG ✓';
        container.style.display = '';
        container.style.opacity = '1';
        break;

      case 'download':
        container.className = 'arrows-text-widget-container widget-ready-state';
        textEl.innerHTML = 'BẤM ĐỂ TẢI VIDEO ✓';
        container.style.display = '';
        container.style.opacity = '1';
        break;

      case 'error':
        container.classList.add('widget-error');
        textEl.innerHTML = '⚠️ LỖI KHỞI TẠO VIDEO';
        container.style.display = '';
        container.style.opacity = '0.55';
        break;

      case 'hidden':
        container.classList.add('widget-hidden');
        container.style.display = 'none';
        container.style.opacity = '0';
        break;
    }
  }

  /* ── Hook patch window.beerBtn* ── */
  function patchArrowsWidget() {
    if (window.beerBtnReset && !window.beerBtnReset._widgetArrowsPatched) {
      var orig = window.beerBtnReset;
      window.beerBtnReset = function () {
        orig.apply(this, arguments);
        updateWidgetState('loading');
      };
      window.beerBtnReset._widgetArrowsPatched = true;
    }

    if (window.beerBtnComplete && !window.beerBtnComplete._widgetArrowsPatched) {
      var origC = window.beerBtnComplete;
      window.beerBtnComplete = function () {
        origC.apply(this, arguments);
        updateWidgetState('ready');
      };
      window.beerBtnComplete._widgetArrowsPatched = true;
    }

    if (window.beerBtnError && !window.beerBtnError._widgetArrowsPatched) {
      var origE = window.beerBtnError;
      window.beerBtnError = function () {
        origE.apply(this, arguments);
        updateWidgetState('error');
      };
      window.beerBtnError._widgetArrowsPatched = true;
    }

    if (window.beerBtnHide && !window.beerBtnHide._widgetArrowsPatched) {
      var origH = window.beerBtnHide;
      window.beerBtnHide = function () {
        origH.apply(this, arguments);
        updateWidgetState('hidden');
      };
      window.beerBtnHide._widgetArrowsPatched = true;
    }

    if (window.beerBtnShow && !window.beerBtnShow._widgetArrowsPatched) {
      var origS = window.beerBtnShow;
      window.beerBtnShow = function () {
        origS.apply(this, arguments);
        updateWidgetState('loading');
      };
      window.beerBtnShow._widgetArrowsPatched = true;
    }

    return !!(
      window.beerBtnReset    && window.beerBtnReset._widgetArrowsPatched    &&
      window.beerBtnComplete && window.beerBtnComplete._widgetArrowsPatched &&
      window.beerBtnError    && window.beerBtnError._widgetArrowsPatched    &&
      window.beerBtnHide     && window.beerBtnHide._widgetArrowsPatched
    );
  }

  // Poll hook
  var attempts = 0;
  var timer = setInterval(function () {
    attempts++;
    var ok = patchArrowsWidget();
    
    // Auto sync state ban đầu nếu đã có
    var st = window.faceswapState;
    if (st && (st.videoUrl || st.imageResult) && _state === 'loading') {
      updateWidgetState('ready');
    }
    
    if (ok || attempts > 100) {
      clearInterval(timer);
    }
  }, 200);

  // Hook ngay
  patchArrowsWidget();

  // Polling để phát hiện trạng thái tải video (is-download-ready) từ mọi beer-btn-shell trên DOM
  setInterval(function () {
    var shells = document.querySelectorAll('.beer-btn-shell');
    var isDownloadReady = false;
    var isReady = false;
    
    shells.forEach(function(s) {
      if (s.classList.contains('is-download-ready') || s.dataset.videoCtaState === 'download') {
        isDownloadReady = true;
      } else if (s.classList.contains('is-ready') || s.dataset.videoCtaState === 'ready') {
        isReady = true;
      }
    });

    if (isDownloadReady && _state !== 'download') {
      updateWidgetState('download');
    } else if (!isDownloadReady && isReady && _state !== 'ready') {
      updateWidgetState('ready');
    }
  }, 200);

})();
</script>
