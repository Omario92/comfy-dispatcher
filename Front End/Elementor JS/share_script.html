<script>
  document.addEventListener("DOMContentLoaded", () => {

    const FB_APP_ID = "991207586610170";
    const SHARE_URL = "https://biatuoi-halida.com/";
    const SHARE_TITLE = "Bia tươi Halida — Tiệc Vui Muôn Vẻ";
    const QUOTE_TEXT = "Ae vô đây check var thử coi mình có tài năng tiềm ẩn gì trên bàn nhậu không, xong gửi kết quả cho tui. Đủ đội hình mình lập hội đi Tiệc Vui Muôn Vẻ luôn nha 😂";
    const HASHTAG = "#BiaTuoiHalida";

    /* ================== INIT FACEBOOK SDK ================== */
    window.fbAsyncInit = function () {
      FB.init({
        appId: FB_APP_ID,
        xfbml: true,
        version: "v19.0",
        autoLogAppEvents: true
      });
    };

    (function (d, s, id) {
      var js, fjs = d.getElementsByTagName(s)[0];
      if (d.getElementById(id)) return;
      js = d.createElement(s);
      js.id = id;
      js.async = true;
      js.defer = true;
      js.crossOrigin = "anonymous";
      js.src = "https://connect.facebook.net/vi_VN/sdk.js";
      fjs.parentNode.insertBefore(js, fjs);
    }(document, "script", "facebook-jssdk"));

    /* ================== HELPERS ================== */
    function detectEnv() {
      const ua = navigator.userAgent || "";
      const isIOS = /iPad|iPhone|iPod/.test(ua) && !window.MSStream;
      const isAndroid = /Android/i.test(ua);
      const isMobile = isIOS || isAndroid;
      const isInAppBrowser = /FBAN|FBAV|Instagram|Line|MicroMessenger/i.test(ua);
      return { isIOS, isAndroid, isMobile, isInAppBrowser };
    }

    function showToast(msg, duration = 3000) {
      const toast = document.createElement("div");
      toast.style.cssText = `
        position: fixed; bottom: 30px; left: 50%; transform: translateX(-50%);
        background: #111; color: #fff; padding: 12px 20px; border-radius: 10px;
        font-size: 14px; z-index: 100000; box-shadow: 0 8px 24px rgba(0,0,0,.3);
        max-width: 90vw; text-align: center;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      `;
      toast.textContent = msg;
      document.body.appendChild(toast);
      setTimeout(() => toast.remove(), duration);
    }

    async function copyQuoteToClipboard() {
      try {
        await navigator.clipboard.writeText(QUOTE_TEXT);
        return true;
      } catch (err) {
        console.warn("Clipboard write failed:", err);
        return false;
      }
    }

    /* ================== LẤY MEDIA TỪ DOM ================== */
    function getResultMedia() {
      // 1. First priority: Check the global state to get exactly the finished swapped files
      if (window.faceswapState) {
        const stateImage = window.faceswapState.imageResult ? (window.faceswapState.imageResult.image_url || window.faceswapState.imageResult.preview_url) : null;
        const stateVideo = window.faceswapState.videoUrl || window.faceswapState.currentVideoUrl;
        
        // Ensure we don't return temporary / invalid URLs from the state
        const validImage = (stateImage && !stateImage.startsWith("data:") && !stateImage.startsWith("blob:")) ? stateImage : null;
        const validVideo = (stateVideo && !stateVideo.startsWith("data:") && !stateVideo.startsWith("blob:")) ? stateVideo : null;
        
        return {
          imageUrl: validImage || null,
          videoUrl: validVideo || null
        };
      }

      // 2. Fallback: If global state is not exposed, scrape the DOM but ensure the elements are actually visible/ready,
      // avoiding any temporary, placeholder, or data/blob files before the swap completes.
      const imgEl = document.querySelector("#result-image .elementor-widget-container img") || 
                    document.querySelector("#result-image img");
      const videoEl = document.querySelector("#result-video video.elementor-video") || 
                      document.querySelector("#result-video video") ||
                      document.querySelector("#result-video video.elementor-html5-video");
      
      const isImageVisible = document.querySelector("#result-image")?.classList.contains("visible");
      const isVideoReady = videoEl && videoEl.src && !document.querySelector("#result-video")?.classList.contains("video-section-hidden");

      const imageUrl = (isImageVisible && imgEl && imgEl.src && !imgEl.src.startsWith("data:") && !imgEl.src.startsWith("blob:")) ? imgEl.src : null;
      const videoUrl = (isVideoReady && videoEl && videoEl.src && !videoEl.src.startsWith("data:") && !videoEl.src.startsWith("blob:")) ? videoEl.src : null;

      return {
        imageUrl,
        videoUrl
      };
    }

    /* ================== FETCH MEDIA → FILE ================== */
    async function urlToFile(url, filename, mimeType) {
      const response = await fetch(url, { mode: "cors" });
      if (!response.ok) throw new Error(`Fetch failed: ${response.status}`);
      const blob = await response.blob();
      return new File([blob], filename, { type: mimeType || blob.type });
    }

    async function buildShareFiles() {
      const { imageUrl, videoUrl } = getResultMedia();
      const files = [];

      // Ưu tiên video (highlight của faceswap)
      if (videoUrl) {
        try {
          const videoFile = await urlToFile(videoUrl, "halida-faceswap.mp4", "video/mp4");
          files.push(videoFile);
          return files;
        } catch (err) {
          console.warn("Không lấy được video, thử ảnh:", err);
        }
      }

      // Fallback sang ảnh nếu video fail hoặc không có
      if (imageUrl) {
        try {
          const imgFile = await urlToFile(imageUrl, "halida-faceswap.jpg", "image/jpeg");
          files.push(imgFile);
        } catch (err) {
          console.warn("Không lấy được ảnh:", err);
        }
      }

      return files;
    }

    /* ================== SHARE HANDLERS ================== */
    async function shareToZalo() {
      const { isMobile } = detectEnv();

      if (isMobile) {
        const zaloDeepLink =
          `https://zalo.me/share/link` +
          `?url=${encodeURIComponent(SHARE_URL)}` +
          `&text=${encodeURIComponent(QUOTE_TEXT)}`;
        window.location.href = zaloDeepLink;
        return;
      }

      try {
        await navigator.clipboard.writeText(`${QUOTE_TEXT}\n${SHARE_URL}`);
        showToast("Đã sao chép nội dung! Mở Zalo và dán vào khung chat để chia sẻ.");
      } catch {
        prompt("Sao chép nội dung dưới đây:", `${QUOTE_TEXT}\n${SHARE_URL}`);
      }
    }

    function openFacebookShareFallback(useLocation) {
      const fbShareUrl =
        `https://www.facebook.com/sharer/sharer.php` +
        `?u=${encodeURIComponent(SHARE_URL)}` +
        `&quote=${encodeURIComponent(QUOTE_TEXT)}`;

      if (useLocation) {
        window.location.href = fbShareUrl;
      } else {
        window.open(fbShareUrl, "fb-share", "width=600,height=700,scrollbars=yes,resizable=yes");
      }
    }

    async function shareToFacebook() {
      const { isMobile } = detectEnv();

      // Copy quote vào clipboard TRƯỚC khi mở dialog FB
      // → User chỉ cần paste vào ô "Say something about this..."
      const copied = await copyQuoteToClipboard();
      if (copied) {
        showToast("Đã sao chép nội dung! Dán vào ô đăng bài trên Facebook nhé.", 4000);
      }

      // Delay nhẹ để toast hiện kịp trước khi mở dialog
      setTimeout(() => {
        if (window.FB && typeof window.FB.ui === "function" && !isMobile) {
          FB.ui(
            { method: "share", href: SHARE_URL, quote: QUOTE_TEXT, hashtag: HASHTAG },
            (res) => console.log("FB share:", res)
          );
        } else {
          openFacebookShareFallback(isMobile);
        }
      }, 400);
    }

    /* ================== SHARE HANDLER CHÍNH ================== */
    async function handleShare() {
      const { imageUrl, videoUrl } = getResultMedia();
      if (!imageUrl && !videoUrl) {
        showToast("Vui lòng đợi quá trình tạo ảnh/video hoàn tất để chia sẻ!");
        return;
      }

      const { isMobile, isInAppBrowser } = detectEnv();

      // ===== MOBILE: ưu tiên Web Share API kèm FILE =====
      if (isMobile && !isInAppBrowser && navigator.share) {
        showToast("Đang chuẩn bị nội dung...", 2000);

        try {
          const files = await buildShareFiles();

          // Share kèm file (video/ảnh)
          if (files.length && navigator.canShare && navigator.canShare({ files })) {
            try {
              await navigator.share({
                files,
                title: SHARE_TITLE,
                text: `${QUOTE_TEXT}\n${SHARE_URL}`
              });
              return;
            } catch (err) {
              if (err.name === "AbortError") return;
              console.warn("Share with files failed:", err);
            }
          }

          // Fallback: share text + URL (không kèm file)
          try {
            await navigator.share({
              title: SHARE_TITLE,
              text: QUOTE_TEXT,
              url: SHARE_URL
            });
            return;
          } catch (err) {
            if (err.name === "AbortError") return;
            console.warn("Web Share API failed:", err);
          }
        } catch (err) {
          console.warn("buildShareFiles error:", err);
        }
      }

      // Fallback: menu chọn thủ công
      showShareMenu();
    }

    /* ================== SHARE MENU (fallback) ================== */
    function showShareMenu() {
      const existed = document.getElementById("custom-share-menu");
      if (existed) existed.remove();

      const overlay = document.createElement("div");
      overlay.id = "custom-share-menu";
      overlay.style.cssText = `
        position: fixed; inset: 0; background: rgba(0,0,0,.55);
        display: flex; align-items: center; justify-content: center;
        z-index: 99999; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      `;

      overlay.innerHTML = `
        <div style="background:#fff; border-radius:16px; padding:24px; width:min(90vw,360px); box-shadow:0 20px 60px rgba(0,0,0,.3);">
          <div style="font-size:18px; font-weight:600; text-align:center; margin-bottom:18px; color:#111;">
            Chia sẻ tới
          </div>

          <button data-action="facebook" style="
            display:flex; align-items:center; gap:12px; width:100%; padding:12px 14px;
            border:none; border-radius:10px; background:#1877F2; color:#fff;
            font-size:15px; font-weight:600; cursor:pointer; margin-bottom:10px;">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="#fff">
              <path d="M22 12a10 10 0 1 0-11.6 9.9v-7H8v-2.9h2.4V9.8c0-2.4 1.4-3.7 3.6-3.7 1 0 2.1.2 2.1.2v2.3h-1.2c-1.2 0-1.5.7-1.5 1.5v1.8h2.6l-.4 2.9h-2.2v7A10 10 0 0 0 22 12z"/>
            </svg>
            Facebook
          </button>

          <button data-action="zalo" style="
            display:flex; align-items:center; gap:12px; width:100%; padding:12px 14px;
            border:none; border-radius:10px; background:#0068FF; color:#fff;
            font-size:15px; font-weight:600; cursor:pointer; margin-bottom:14px;">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="#fff">
              <path d="M12 2C6.5 2 2 5.9 2 10.7c0 2.7 1.4 5.1 3.7 6.7-.1.6-.5 2-.6 2.3 0 0-.1.2.1.3.1.1.3 0 .3 0 .4-.1 2.7-1.4 3.2-1.6.9.2 2 .4 3.3.4 5.5 0 10-3.9 10-8.7S17.5 2 12 2z"/>
            </svg>
            Zalo
          </button>

          <button data-action="close" style="
            width:100%; padding:10px; border:none; background:transparent;
            color:#6b7280; font-size:14px; cursor:pointer;">
            Huỷ
          </button>
        </div>
      `;

      overlay.addEventListener("click", async (e) => {
        const btn = e.target.closest("button[data-action]");
        if (!btn && e.target !== overlay) return;

        const action = btn ? btn.dataset.action : "close";

        if (action === "facebook") {
          overlay.remove();
          shareToFacebook();
        } else if (action === "zalo") {
          overlay.remove();
          shareToZalo();
        } else {
          overlay.remove();
        }
      });

      document.body.appendChild(overlay);
    }

    const btnShare = document.getElementById("btn-share");
    if (btnShare) btnShare.addEventListener("click", handleShare);

  });
</script>
